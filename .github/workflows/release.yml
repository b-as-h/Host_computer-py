name: 构建与发布

# 推送到 main：只构建 + 存产物，用来验证打包链路
# 推送 v* 标签：构建后自动创建 Release 并挂上安装包与绿色版
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # runner 默认 cp1252，Python 输出中文会崩；统一走 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 离线自检（116 项协议、日志、布局与蓝牙断言）
        shell: pwsh
        run: |
          $out = & python selftest.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # 注解只显示首行，这里把多行压成一行，方便直接看到异常类型与位置
            $flat = ($out -split "`r?`n" | Where-Object { $_.Trim() }) -join " | "
            if ($flat.Length -gt 900) { $flat = $flat.Substring(0, 900) }
            Write-Host "::error title=selftest 失败::$flat"
            exit 1
          }

      - name: 打包单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --icon app.ico
          --version-file installer/version_info.txt
          --collect-all serial
          --name STM32Host
          --distpath dist
          host_monitor.py

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe",
                                  "${env:ProgramFiles}\Inno Setup*\ISCC.exe" `
                                  -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            Write-Host "::error title=找不到 ISCC::choco 安装的 Inno Setup 未进入 PATH"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          $out = & $iscc /Qp "installer\STM32Host.iss" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $flat = ($out -split "`r?`n" | Where-Object { $_.Trim() }) -join " | "
            if ($flat.Length -gt 900) { $flat = $flat.Substring(0, 900) }
            Write-Host "::error title=ISCC 编译失败::$flat"
            exit 1
          }

      - name: 生成校验文件并检查产物
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $setup = Get-ChildItem "dist\STM32Host-Setup-*.exe"
          if (-not $setup) { throw "安装包未生成" }
          $lines = @()
          foreach ($f in @($setup) + @(Get-Item "dist\STM32Host.exe")) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($f.Name)"
          }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: STM32Host-${{ github.sha }}
          path: |
            dist/STM32Host.exe
            dist/STM32Host-Setup-*.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: STM32 Host 上位机 ${{ github.ref_name }}
          files: |
            dist/STM32Host.exe
            dist/STM32Host-Setup-*.exe
            dist/SHA256SUMS.txt
          body: |
            ## STM32 Host 上位机 ${{ github.ref_name }}

            由 GitHub Actions 在 `windows-latest` 上自动构建，产物与标签提交一一对应。

            ### 新增
            - 串口终端新增 **自动滚动** 开关：只有视图位于底部时才跟随新消息，
              向上翻看不会被拉回，可固定查看历史
            - 日志历史从 400 行提升到 **2000 行**，超出后一次修剪 500 行
            - 默认波特率改为 **115200**（`DEFAULT_BAUD`），启动即按新速率连接

            ### 改进
            - README 第七节重写为「上位机 / 固件 / 蓝牙模块三处速率对齐」，
              补充 HC-05 `AT+UART=115200,0,0`、HC-06 `AT+BAUD8` 的设置方法
            - `SYS` 示例与 `PC` 帧传输耗时按 115200 修正
            - 自检从 113 项扩展到 **116 项**，新增日志历史保留与手动翻看断言

            ### 升级注意（重要）
            默认波特率从 9600 改为 115200，升级后必须同步两处：

            1. **固件**：初始化 USART1 的波特率改为 115200
               （江科大 `Serial.c` 的 `USART_BaudRate`；HAL 工程改 `huart1.Init.BaudRate`）
            2. **蓝牙模块**：HC-05 在 AT 模式发 `AT+UART=115200,0,0`；
               HC-06 发 `AT+BAUD8`，断电重启生效

            否则连接后只会看到 `> PING`，收不到 `+PONG`。
            临时回退：把顶部下拉框选回 9600，或继续使用 v1.11.0。

            ### 安装
            1. 下载本页资产中的 `STM32Host-Setup-*.exe`（文件名带版本号）。
            2. 双击运行。安装包**未做代码签名**，SmartScreen 可能提示未知发布者，
               点「更多信息 → 仍要运行」。
            3. 默认安装到 `%LOCALAPPDATA%\Programs\STM32Host`，按当前用户安装，不需要管理员权限。
            4. 卸载：设置 → 应用 → 已安装的应用 → STM32 Host 上位机。

            不想安装可直接用 `STM32Host.exe` 绿色版，双击即运行。

            ### 校验
            `SHA256SUMS.txt` 内含两个产物的 SHA-256，核对命令（PowerShell）：

            ```powershell
            Get-FileHash .\STM32Host-Setup-*.exe -Algorithm SHA256
            ```

            ### 说明
            - 自动化测试使用虚拟串口与固定数据，**未做真实硬件回归**；
              本次升级请重点复测 115200 链路、蓝牙模块 AT 配置与供电。
            - 源码运行需要 Python 3.9+ 64 位（含 tkinter），依赖仅 pyserial。
