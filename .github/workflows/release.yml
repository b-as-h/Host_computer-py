name: 构建与发布

# 推送到 main：只构建 + 存产物，用来验证打包链路
# 推送 v* 标签：构建后自动创建 Release 并挂上安装包与绿色版
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # runner 默认 cp1252，Python 输出中文会崩；统一走 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 离线自检（113 项协议、布局与蓝牙断言）
        shell: pwsh
        run: |
          $out = & python selftest.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # 注解只显示首行，这里把多行压成一行，方便直接看到异常类型与位置
            $flat = ($out -split "`r?`n" | Where-Object { $_.Trim() }) -join " | "
            if ($flat.Length -gt 900) { $flat = $flat.Substring(0, 900) }
            Write-Host "::error title=selftest 失败::$flat"
            exit 1
          }

      - name: 打包单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --icon app.ico
          --version-file installer/version_info.txt
          --collect-all serial
          --name STM32Host
          --distpath dist
          host_monitor.py

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe",
                                  "${env:ProgramFiles}\Inno Setup*\ISCC.exe" `
                                  -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            Write-Host "::error title=找不到 ISCC::choco 安装的 Inno Setup 未进入 PATH"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          $out = & $iscc /Qp "installer\STM32Host.iss" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $flat = ($out -split "`r?`n" | Where-Object { $_.Trim() }) -join " | "
            if ($flat.Length -gt 900) { $flat = $flat.Substring(0, 900) }
            Write-Host "::error title=ISCC 编译失败::$flat"
            exit 1
          }

      - name: 生成校验文件并检查产物
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $setup = Get-ChildItem "dist\STM32Host-Setup-*.exe"
          if (-not $setup) { throw "安装包未生成" }
          $lines = @()
          foreach ($f in @($setup) + @(Get-Item "dist\STM32Host.exe")) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($f.Name)"
          }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: STM32Host-${{ github.sha }}
          path: |
            dist/STM32Host.exe
            dist/STM32Host-Setup-*.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: STM32 Host 上位机 ${{ github.ref_name }}
          files: |
            dist/STM32Host.exe
            dist/STM32Host-Setup-*.exe
            dist/SHA256SUMS.txt
          body: |
            ## STM32 Host 上位机 ${{ github.ref_name }}

            由 GitHub Actions 在 `windows-latest` 上自动构建，产物与标签提交一一对应。

            ### 新增
            - **程序内蓝牙配对**：顶部「蓝牙」按钮打开设备窗口，扫描附近设备（能发现
              还没配对的 HC-05）、按 PIN 静默配对、自动启用 SPP 服务、等系统分配 COM 口后
              回填并连接，全程不用跳「设置 → 蓝牙和其他设备」
            - **`btlink.py`**：纯 ctypes 封装 `BluetoothAPIs.dll` 与 `bthprops.cpl`，
              零第三方依赖；配对函数在 bthprops 而非 BluetoothAPIs，这点很多实现会踩空
            - **`tools/bt_selftest.py`**：蓝牙链路自检，只读不写，可单独运行

            ### 改进
            - 端口下拉框改为「蓝牙 > USB 串口 > 主板自带口」排序，蓝牙口带 `[蓝牙]` 标注；
              原来主板 COM1 永远排第一，每次都要翻一格才能选到 CH340
            - 记住上次连接的端口（`link.last_port`），启动自动选回
            - 自检从 95 项扩展到 **113 项**，新增蓝牙地址解析、hwid 识别与端口排序断言

            ### 已知限制
            - 仅支持**经典蓝牙 SPP**（HC-05 / HC-06 / 开 SPP 的 ESP32）。
              **ESP32-C3 只有 BLE**，不会生成 COM 口，暂不支持
            - 配对链路未在真实模块上回归，首次使用请按 README「连接步骤 → 方式一」走一遍

            ### 安装
            1. 下载本页资产中的 `STM32Host-Setup-*.exe`（文件名带版本号）。
            2. 双击运行。安装包**未做代码签名**，SmartScreen 可能提示未知发布者，
               点「更多信息 → 仍要运行」。
            3. 默认安装到 `%LOCALAPPDATA%\Programs\STM32Host`，按当前用户安装，不需要管理员权限。
            4. 卸载：设置 → 应用 → 已安装的应用 → STM32 Host 上位机。

            不想安装可直接用 `STM32Host.exe` 绿色版，双击即运行。

            ### 校验
            `SHA256SUMS.txt` 内含两个产物的 SHA-256，核对命令（PowerShell）：

            ```powershell
            Get-FileHash .\STM32Host-Setup-*.exe -Algorithm SHA256
            ```

            ### 说明
            - 自动化测试使用虚拟串口与固定数据，**未做真实硬件回归**；
              串口、蓝牙、CH340 驱动、供电和线缆仍需在开发板上复测。
            - 源码运行需要 Python 3.9+ 64 位（含 tkinter），依赖仅 pyserial。
